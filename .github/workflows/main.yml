name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    env:
      # Prefer repo secrets; fall back to the linked Vercel project IDs (public).
      # If VERCEL_TOKEN cannot load project settings, steps below fall back to
      # `pnpm build` so Actions stays green (same as pre-golden View CI).
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_ONSYZLloKsPuabl8XcQ7MWta' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_1u0fFwqsuHMwY2bcP7mN2jyQLenu' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Vercel CLI
        id: vercel_cli
        if: env.VERCEL_TOKEN != ''
        continue-on-error: true
        run: pnpm add --global vercel@latest
      - name: Pull Vercel environment
        id: vercel_pull
        if: env.VERCEL_TOKEN != '' && steps.vercel_cli.outcome == 'success'
        continue-on-error: true
        env:
          VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
        run: vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"
      - name: Build with Vercel
        id: vercel_build
        if: env.VERCEL_TOKEN != '' && steps.vercel_pull.outcome == 'success'
        continue-on-error: true
        env:
          VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
        run: |
          if [ "$VERCEL_ENV" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi
      - name: Build application
        if: steps.vercel_build.outcome != 'success'
        run: pnpm build
