name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: crashoutcompany/.github/.github/workflows/ci.yml@020f7e78cd5cd56b0d110210bd2ef1b715c75be3 # v1.4.0
    with:
      has-e2e: false
    secrets: inherit
